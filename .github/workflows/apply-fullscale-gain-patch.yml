name: Apply legacy full-scale gain patch

on:
  push:
    branches:
      - feat/legacy-11point-calibration-20260903

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/legacy-11point-calibration-20260903
          fetch-depth: 0
      - name: Patch firmware calibration semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'pattern not found in {path}: {old[:120]!r}')
              if text.count(old) != 1:
                  raise SystemExit(f'pattern not unique in {path}: count={text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'Core/Src/sys_product_profile.c',
              '''        sys_product_profile_validate_legacy_i_max(\n            profile, calibration_voltage_01v,\n            calibrated_max_current_ma) != BOOL_TRUE ||\n        (calibrated_max_current_ma != 0U &&\n         configured_rated_current_ma > calibrated_max_current_ma))''',
              '''        sys_product_profile_validate_legacy_i_max(\n            profile, calibration_voltage_01v,\n            calibrated_max_current_ma) != BOOL_TRUE)''')

          replace_once(
              'Core/Src/sys_calibration_service.h',
              '''extern boolean_en sys_calibration_service_get_calibrated_max_current_ma(\n    u16 bound_voltage_01v,\n    u16 *calibrated_max_current_ma);\nextern boolean_en sys_calibration_service_correct_output_percent(''',
              '''extern boolean_en sys_calibration_service_get_calibrated_max_current_ma(\n    u16 bound_voltage_01v,\n    u16 *calibrated_max_current_ma);\nextern boolean_en sys_calibration_service_get_calibrated_target_current_ma(\n    u16 bound_voltage_01v,\n    u16 *calibrated_target_current_ma);\nextern boolean_en sys_calibration_service_apply_fullscale_gain_pwm(\n    u16 nominal_pwm,\n    u16 pwm_limit,\n    u16 *corrected_pwm);\nextern boolean_en sys_calibration_service_correct_output_percent(''')

          replace_once(
              'Core/Src/sys_calibration_service.c',
              '''    u16 characterized_i_max_ma;\n    u32 minimum_span_current_ma;''',
              '''    u16 characterized_i_max_ma;\n    u16 calibrated_target_ma;\n    u32 minimum_span_current_ma;''')

          replace_once(
              'Core/Src/sys_calibration_service.c',
              '''    characterized_i_max_ma =\n        _service.status.context.calibrated_max_current_ma;\n    for (index = 1U; index < SYS_CALIBRATION_DRIVER_POINT_COUNT; ++index)''',
              '''    characterized_i_max_ma =\n        _service.status.context.calibrated_max_current_ma;\n    calibrated_target_ma =\n        _service.status.context.configured_rated_current_ma;\n    for (index = 1U; index < SYS_CALIBRATION_DRIVER_POINT_COUNT; ++index)''')

          replace_once(
              'Core/Src/sys_calibration_service.c',
              '''    minimum_span_current_ma =\n        ((u32)characterized_i_max_ma *\n         (1000U - profile->calibration_span_tolerance_permille)) / 1000U;\n    maximum_span_current_ma =\n        ((u32)characterized_i_max_ma *\n         (1000U + profile->calibration_span_tolerance_permille) + 999U) /\n        1000U;\n\n    /* The old protocol defines full scale by the external instrument Imax\n       measured in the 50mA->Umax->CV pre-stage. Device current is not used\n       as the span reference because the 11-point table exists to correct it. */''',
              '''    minimum_span_current_ma =\n        ((u32)calibrated_target_ma *\n         (1000U - profile->calibration_span_tolerance_permille)) / 1000U;\n    maximum_span_current_ma =\n        ((u32)calibrated_target_ma *\n         (1000U + profile->calibration_span_tolerance_permille) + 999U) /\n        1000U;\n\n    /* 0x07 Imax is the pre-gain Level200 measurement. After it is written,\n       firmware applies the per-device full-scale gain before the formal\n       11-point sweep, so Level200 must land near configured SET_OUTCUR. */''')

          replace_once(
              'Core/Src/sys_calibration_service.c',
              '''        max_context.maximum_output_current_ma == 0U ||\n        iv_limit_ma == 0U ||\n        max_context.maximum_output_current_ma <\n            _service.status.context.configured_rated_current_ma ||\n        max_context.maximum_output_current_ma > iv_limit_ma ||''',
              '''        max_context.maximum_output_current_ma == 0U ||\n        iv_limit_ma == 0U ||\n        max_context.maximum_output_current_ma > iv_limit_ma ||''')

          replace_once(
              'Core/Src/sys_calibration_service.c',
              '''    /* Persisted context field keeps its wire name for compatibility, but in\n       the legacy flow its semantic value is exactly the measured 0x07 Imax. */''',
              '''    /* Persist the raw pre-gain Level200 Imax. The gain is derived from\n       SET_OUTCUR/Imax at runtime, so no new wire field or Flash coefficient\n       is required and the old 0x07 protocol remains unchanged. */''')

          old_getter = '''boolean_en sys_calibration_service_get_calibrated_max_current_ma(\n    u16 bound_voltage_01v,\n    u16 *calibrated_max_current_ma)\n{\n    if (calibrated_max_current_ma == NULL ||\n        _service.status.context_valid != BOOL_TRUE ||\n        _service.status.context.calibrated_max_current_ma == 0U ||\n        sys_calibration_service_runtime_context_matches_voltage(\n            bound_voltage_01v) != BOOL_TRUE)\n    {\n        return BOOL_FALSE;\n    }\n    *calibrated_max_current_ma =\n        _service.status.context.calibrated_max_current_ma;\n    return BOOL_TRUE;\n}\n'''
          new_getter = old_getter + '''\nboolean_en sys_calibration_service_get_calibrated_target_current_ma(\n    u16 bound_voltage_01v,\n    u16 *calibrated_target_current_ma)\n{\n    if (calibrated_target_current_ma == NULL ||\n        _service.status.context_valid != BOOL_TRUE ||\n        _service.status.context.configured_rated_current_ma == 0U ||\n        _service.status.context.calibrated_max_current_ma == 0U ||\n        sys_calibration_service_runtime_context_matches_voltage(\n            bound_voltage_01v) != BOOL_TRUE)\n    {\n        return BOOL_FALSE;\n    }\n    *calibrated_target_current_ma =\n        _service.status.context.configured_rated_current_ma;\n    return BOOL_TRUE;\n}\n\nboolean_en sys_calibration_service_apply_fullscale_gain_pwm(\n    u16 nominal_pwm,\n    u16 pwm_limit,\n    u16 *corrected_pwm)\n{\n    u32 scaled_pwm;\n    u16 characterized_i_max_ma;\n    u16 target_current_ma;\n\n    if (corrected_pwm == NULL || pwm_limit == 0U || nominal_pwm > pwm_limit)\n    {\n        return BOOL_FALSE;\n    }\n    *corrected_pwm = nominal_pwm;\n    if (_service.status.context_valid != BOOL_TRUE ||\n        _service.status.context.calibrated_max_current_ma == 0U ||\n        _service.status.context.configured_rated_current_ma == 0U)\n    {\n        return BOOL_TRUE;\n    }\n    characterized_i_max_ma =\n        _service.status.context.calibrated_max_current_ma;\n    target_current_ma =\n        _service.status.context.configured_rated_current_ma;\n    scaled_pwm = ((u32)nominal_pwm * (u32)target_current_ma +\n                  (u32)characterized_i_max_ma / 2U) /\n                 (u32)characterized_i_max_ma;\n    if (scaled_pwm > pwm_limit)\n    {\n        scaled_pwm = pwm_limit;\n    }\n    *corrected_pwm = (u16)scaled_pwm;\n    return BOOL_TRUE;\n}\n'''
          replace_once('Core/Src/sys_calibration_service.c', old_getter, new_getter)

          replace_once(
              'Core/Src/sys_calibration_service.c',
              '''        sys_calibration_service_validate_table(\n            &table, &calibrated_max_current_ma) != BOOL_TRUE ||\n        rated_current_ma > calibrated_max_current_ma)''',
              '''        sys_calibration_service_validate_table(\n            &table, &calibrated_max_current_ma) != BOOL_TRUE)''')

          replace_once(
              'Core/Src/sys_pwm.c',
              '''             if (sys_product_profile_scale_percent_to_pwm(\n                     sys_product_profile_current(),\n                     BOUND_OUTPUT_VOLTAGE_01V, persent,\n                     PWM_USEFUL_RANGE, &pwm) == BOOL_TRUE)\n             {\n                 pwm_value = pwm;''',
              '''             if (sys_product_profile_scale_percent_to_pwm(\n                     sys_product_profile_current(),\n                     BOUND_OUTPUT_VOLTAGE_01V, persent,\n                     PWM_USEFUL_RANGE, &pwm) == BOOL_TRUE &&\n                 sys_calibration_service_apply_fullscale_gain_pwm(\n                     pwm, PWM_USEFUL_RANGE, &pwm) == BOOL_TRUE)\n             {\n                 pwm_value = pwm;''')

          replace_once(
              'Core/Src/sys_pwm.c',
              '''    if (sys_product_profile_scale_percent_to_pwm(\n            profile, context.calibration_voltage_01v, safe_percent,\n            PWM_USEFUL_RANGE, &pwm) != BOOL_TRUE)''',
              '''    if (sys_product_profile_scale_percent_to_pwm(\n            profile, context.calibration_voltage_01v, safe_percent,\n            PWM_USEFUL_RANGE, &pwm) != BOOL_TRUE ||\n        sys_calibration_service_apply_fullscale_gain_pwm(\n            pwm, PWM_USEFUL_RANGE, &pwm) != BOOL_TRUE)''')

          p = Path('Core/Src/factory_user_data.c')
          text = p.read_text()
          count = text.count('sys_calibration_service_get_calibrated_max_current_ma(')
          if count != 2:
              raise SystemExit(f'expected 2 factory calibrated-max getter calls, found {count}')
          p.write_text(text.replace('sys_calibration_service_get_calibrated_max_current_ma(',
                                    'sys_calibration_service_get_calibrated_target_current_ma('))

          replace_once(
              'tools/calibration/test_snapshot.c',
              '''        unsigned short corrected_current;\n        unsigned char corrected_percent;''',
              '''        unsigned short corrected_current;\n        unsigned short gained_pwm;\n        unsigned short calibrated_target_current;\n        unsigned char corrected_percent;''')
          replace_once(
              'tools/calibration/test_snapshot.c',
              '''             0x02U, 0x58U, 0x03U, 0x7AU, 0xB3U, 0x0DU, 0x0AU};''',
              '''             0x02U, 0x58U, 0x03U, 0x20U, 0x59U, 0x0DU, 0x0AU};''')
          replace_once(
              'tools/calibration/test_snapshot.c',
              '''                                    560U, 890U, 890U,\n                                    sys_calibration_storage_crc32(''',
              '''                                    560U, 890U, 800U,\n                                    sys_calibration_storage_crc32(''')
          replace_once(
              'tools/calibration/test_snapshot.c',
              '''                                "staged context stores legacy 0x07 characterized Imax");''',
              '''                                "staged context stores pre-gain legacy 0x07 Imax");''')
          replace_once(
              'tools/calibration/test_snapshot.c',
              '''                                    service_status.context.calibrated_max_current_ma == 890U,\n                                "legacy 0x07 writes characterized Imax before STAGE");''',
              '''                                    service_status.context.calibrated_max_current_ma == 800U,\n                                "legacy 0x07 accepts pre-gain Imax below SET_OUTCUR");\n        failures += expect_true(\n            sys_calibration_service_apply_fullscale_gain_pwm(\n                500U, 1000U, &gained_pwm) == BOOL_TRUE && gained_pwm == 556U,\n            "pre-gain Imax derives internal full-scale PWM gain");\n        failures += expect_true(\n            sys_calibration_service_get_calibrated_target_current_ma(\n                560U, &calibrated_target_current) == BOOL_TRUE &&\n                calibrated_target_current == 890U,\n            "runtime current gate uses calibrated target rather than pre-gain Imax");''')
          replace_once(
              'tools/calibration/test_snapshot.c',
              '''            sys_calibration_service_runtime_context_matches_voltage(550U) ==\n                BOOL_FALSE &&\n            service_status.context.calibrated_max_current_ma == 890U &&\n            sys_calibration_service_correct_output_current(''',
              '''            sys_calibration_service_runtime_context_matches_voltage(550U) ==\n                BOOL_FALSE &&\n            service_status.context.calibrated_max_current_ma == 800U &&\n            sys_calibration_service_correct_output_current(''')
          PY
      - name: Run firmware host tests
        run: bash tools/calibration/run_host_tests.sh
      - name: Commit patched firmware
        shell: bash
        run: |
          rm .github/workflows/apply-fullscale-gain-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(calibration): gain-correct full scale before 11-point PWL"
          git push origin HEAD:feat/legacy-11point-calibration-20260903
