name: Apply V3 real calibration patch

on:
  push:
    branches:
      - fix/v3-real-calibration-20260831

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v3-real-calibration-20260831
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply precise patches
        run: |
          python tools/apply_v3_real_calibration_patch.py
          python tools/apply_v3_pwl_stage_guard.py
      - name: Static calibration contract checks
        run: |
          grep -F 'percent * (u32)SET_OUTCUR' Core/Src/sys_pwm.c
          grep -F '((u32)HWMAX_OUTCUR * 100U)' Core/Src/sys_pwm.c
          grep -F 'sys_calibration_service_session_output_axis_valid' Core/Src/sys_calibration_service.c
          grep -F 'calibrationVoltage01V' Core/Src/sys_calibration_mqtt.c
          grep -F 'logicalPwm' Core/Src/sys_calibration_mqtt.c
      - name: Commit patched source
        run: |
          if git diff --quiet; then
            echo 'No source changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Core/Src/sys_calibration_mqtt.c Core/Src/sys_calibration_service.c
          git commit -m 'feat(calibration): enforce V3 real PWL calibration contract'
          git push origin HEAD:fix/v3-real-calibration-20260831
