name: Apply V3 real calibration patch

on:
  push:
    branches:
      - fix/v3-real-calibration-20260831

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v3-real-calibration-20260831
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply precise patch
        run: python tools/apply_v3_real_calibration_patch.py
      - name: Commit patched source
        run: |
          if git diff --quiet; then
            echo 'No source changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Core/Src/sys_calibration_mqtt.c
          git commit -m 'feat(calibration): extend V3 BEGIN and SET_POINT for real calibration'
          git push origin HEAD:fix/v3-real-calibration-20260831
