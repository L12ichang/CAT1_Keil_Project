name: Apply V3 real calibration patch

on:
  push:
    branches:
      - fix/v3-real-calibration-20260831

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v3-real-calibration-20260831
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply final BUILD baseline patch
        run: python tools/apply_v3_final_calibration_patch.py
      - name: Static calibration contract checks
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Core/Src/sys_pwm.c').read_text(encoding='utf-8')
          assert '((u32)percent * (u32)SET_OUTCUR * (u32)useful_range)' in p
          assert '((u32)HWMAX_OUTCUR * 100U)' in p
          start = p.index('boolean_en sys_pwm_calibration_set_output(')
          end = p.index('boolean_en sys_pwm_calibration_set_direct_pwm(', start)
          build = p[start:end]
          assert 'sys_calibration_service_output_pwm_for_current' not in build
          assert 'sys_pwm_default_for_target(target_current_ma, &logical_pwm)' in build
          runtime_start = p.index('void pwm_output(')
          runtime_end = p.index('void sys_pwm_timer(', runtime_start)
          runtime = p[runtime_start:runtime_end]
          assert 'sys_calibration_service_output_pwm_for_current' in runtime
          assert 'sys_pwm_default_for_percent' in runtime
          service = Path('Core/Src/sys_calibration_service.c').read_text(encoding='utf-8')
          assert 'sys_calibration_service_session_output_axis_valid' in service
          mqtt = Path('Core/Src/sys_calibration_mqtt.c').read_text(encoding='utf-8')
          assert 'calibrationVoltage01V' in mqtt
          assert 'calibrationSpanMa' in mqtt
          assert 'logicalPwm' in mqtt
          print('V3 real calibration invariants OK')
          PY
      - name: Commit patched PWM source
        run: |
          if git diff --quiet; then
            echo 'No source changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Core/Src/sys_pwm.c
          git commit -m 'fix(calibration): build correction from uncalibrated PWM baseline'
          git push origin HEAD:fix/v3-real-calibration-20260831
