name: fix-legacy-fixture-expectations
on:
  push:
    branches: [feat/legacy-11point-calibration-20260903]
    paths:
      - tools/calibration/fix-legacy-fixture-expectations.py
      - .github/workflows/fix-legacy-fixture-expectations.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/legacy-11point-calibration-20260903
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/calibration/fix-legacy-fixture-expectations.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(calibration): align legacy fixture sequence and six-profile CAP"
          git push origin HEAD:feat/legacy-11point-calibration-20260903
