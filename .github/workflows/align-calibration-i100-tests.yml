name: Align legacy calibration I100 tests

on:
  push:
    branches:
      - feat/legacy-11point-calibration-20260903
    paths:
      - .github/workflows/align-calibration-i100-tests.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/legacy-11point-calibration-20260903
          fetch-depth: 0
      - name: Align host test fixtures
        run: python3 .github/scripts/align-calibration-i100-tests.py
      - name: Commit test fixture update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/calibration/test_snapshot.c
          git commit -m "test(calibration): align selected-CV I100 fixtures"
          git push origin HEAD:feat/legacy-11point-calibration-20260903
      - name: Run legacy calibration host tests
        run: bash tools/calibration/run_host_tests.sh
