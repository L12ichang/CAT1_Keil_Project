name: Patch legacy calibration I100 semantics

on:
  push:
    branches:
      - feat/legacy-11point-calibration-20260903
    paths:
      - .github/workflows/patch-calibration-i100.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/legacy-11point-calibration-20260903
          fetch-depth: 0
      - name: Apply I100/CV semantic patch
        run: python3 .github/scripts/patch-calibration-i100.py
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Core/Src/sys_product_profile.c Core/Src/sys_calibration_mqtt.c Core/Src/sys_calibration_service.c Core/Src/sys_pwm.c
          git commit -m "fix(calibration): derive target current from selected CV"
          git push origin HEAD:feat/legacy-11point-calibration-20260903
      - name: Run legacy calibration host tests
        run: bash tools/calibration/run_host_tests.sh
