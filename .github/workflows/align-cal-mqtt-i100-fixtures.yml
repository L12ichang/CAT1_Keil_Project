name: Align CAL MQTT I100 fixtures

on:
  push:
    branches:
      - feat/legacy-11point-calibration-20260903
    paths:
      - .github/workflows/align-cal-mqtt-i100-fixtures.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/legacy-11point-calibration-20260903
          fetch-depth: 0
      - name: Align frozen fixture values
        run: python3 .github/scripts/align-cal-mqtt-i100-fixtures.py
      - name: Commit fixture update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add protocol/fixtures/CAL_MQTT_V2 tools/calibration/test_cal_mqtt_v2.c
          git commit -m "test(calibration): align CAL MQTT selected-CV I100 fixtures"
          git push origin HEAD:feat/legacy-11point-calibration-20260903
      - name: Run legacy calibration host tests
        run: bash tools/calibration/run_host_tests.sh
